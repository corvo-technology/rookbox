name: CLI release

# Builds the Rookbox CLI as a self-contained binary for macOS and Linux (x64 and arm64) and
# publishes them, with a SHA256SUMS file, as a GitHub Release. Push a tag named cli-vX.Y.Z whose
# version matches product/apps/cli/package.json. The installer (product/apps/www/public/install)
# downloads these assets and checks them against SHA256SUMS.

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-15 }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
    defaults:
      run:
        working-directory: product
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: product/package.json
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: product/pnpm-lock.yaml
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the package version
        run: |
          version="$(node -p "require('./apps/cli/package.json').version")"
          if [ "$TAG" != "cli-v$version" ]; then
            echo "Tag $TAG does not match apps/cli/package.json version $version" >&2
            exit 1
          fi
      - run: pnpm --filter @rookbox/cli check
      - run: pnpm --filter @rookbox/cli test
      - name: Compile the binary
        working-directory: product/apps/cli
        run: node scripts/build.mjs --binary
      - name: Smoke the binary
        working-directory: product/apps/cli
        run: |
          bin="dist/rookbox-${{ matrix.target }}"
          "$bin" --help > /dev/null
          expected="$(node -p "require('./package.json').version")"
          test "$("$bin" version)" = "$expected"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rookbox-${{ matrix.target }}
          path: product/apps/cli/dist/rookbox-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          pattern: rookbox-*
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: |
          ls -l
          test "$(ls | wc -l)" -eq 4
          sha256sum rookbox-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        working-directory: assets
        run: |
          gh release create "$TAG" rookbox-* SHA256SUMS \
            --verify-tag \
            --title "Rookbox CLI ${TAG#cli-v}" \
            --notes "Install: \`curl -fsSL https://rookbox.run/install | sh\`. Each binary's SHA256 is in SHA256SUMS; the installer checks it."
